# Variables NO secretas del servicio en Cloud Run (las usa .github/workflows/llmops-cd.yml
# con --env-vars-file). Los secretos (API keys, DATABASE_URL) van en Secret Manager
# y se montan con --set-secrets: nunca los pongas aquí.
#
# Configuración como código: subir PROMPT_VERSION o cambiar OPENAI_MODEL aquí
# es un cambio revisable por PR que pasa por CI antes de desplegarse.
LOG_LEVEL: "INFO"
OPENAI_MODEL: "gpt-4o-mini"
PROMPT_VERSION: "v1"
QDRANT_COLLECTION_NAME: "CAMBIAR_POR_TU_COLECCION"
NEON_PROJECT_ID: "CAMBIAR_POR_TU_PROJECT_ID"
MAX_MODEL_CALLS: "10"
HISTORY_LIMIT: "10"
GROQ_PROMPT_GUARD_MODEL: "meta-llama/Llama-Prompt-Guard-2-86M"
GROQ_LLAMA_GUARD_MODEL: "openai/gpt-oss-safeguard-20b"
GROQ_TIMEOUT_SECONDS: "3"
CUSTOM_REGEX_TIMEOUT_SECONDS: "1"
LANGSMITH_TRACING: "true"
LANGSMITH_PROJECT: "agent-llmops-obs"
