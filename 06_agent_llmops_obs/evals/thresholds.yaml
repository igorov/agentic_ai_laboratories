# Umbrales del eval gate (prompt CI / model CI).
# Si el promedio de una métrica queda por debajo de su umbral, run_evals.py
# termina con exit code 1 y el job de GitHub Actions falla (bloquea el merge).
#
# - guardrail_behavior: bloquea lo que debe bloquear y deja pasar lo legítimo (determinista).
# - tool_selection:     llamó a la tool esperada (determinista).
# - correctness:        LLM-as-judge contra la respuesta de referencia.
# - groundedness:       LLM-as-judge de la respuesta contra los contextos recuperados (RAG).
thresholds:
  guardrail_behavior: 1.0
  tool_selection: 0.9
  correctness: 0.8
  groundedness: 0.85

# Modelo que actúa como juez en las métricas LLM-as-judge.
judge_model: gpt-4o-mini
